name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (pedantic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features

  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Pin the MSRV (error-text-sensitive trybuild snapshots are generated on
        # this toolchain) and also exercise stable.
        rust: ["1.95.0", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      # trybuild .stderr snapshots are pinned to 1.95; only assert them there.
      - name: test (with compile-fail snapshots)
        if: matrix.rust == '1.95.0'
        run: cargo test --workspace
      - name: test (skip pinned compile-fail snapshots)
        if: matrix.rust != '1.95.0'
        run: cargo test --workspace --exclude akadro-compile-tests

  docs:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # Region-based coverage attributes const-fn getters correctly. Excluded from
      # the gate as live-IO/UI exercised only by live (#[ignore]) or manual runs:
      # the connector `net.rs` + WS drivers, the umbrella `data/venues.rs` live
      # `ReqwestTransport` dispatch, and the `akadro-tui` terminal dashboard. The
      # thresholds are the honest measured floor (~97.1% line / 97.8% region as of the
      # v0.2 growth — venue connectors, cache layer, live shell); see AGENTS.md §10 for
      # the residual-line itemization. `playground` is an untested scratch binary (live
      # network, run by hand), excluded from instrumentation like the trybuild crate.
      - run: >-
          cargo llvm-cov --workspace --all-features
          --exclude akadro-compile-tests --exclude playground
          --ignore-filename-regex '(venue-(mexc|binance|okx|bybit|kucoin)/src/net|akadro-live/src/(binance|mexc)|akadro/src/data/venues|akadro-tui/src/lib)\.rs'
          --lcov --output-path lcov.info
      # `report` re-reads the data the previous step produced (compile-tests +
      # playground already excluded at build time); it only re-applies the gate.
      - run: >-
          cargo llvm-cov report
          --ignore-filename-regex '(venue-(mexc|binance|okx|bybit|kucoin)/src/net|akadro-live/src/(binance|mexc)|akadro/src/data/venues|akadro-tui/src/lib)\.rs'
          --fail-under-lines 97 --fail-under-regions 97

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  semver:
    name: semver-checks
    runs-on: ubuntu-latest
    # No published baseline before the first release; enable from 0.1.0 onward.
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  feature-powerset:
    name: cargo-hack feature powerset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - run: cargo hack --workspace --feature-powerset --no-dev-deps check

  alloc-gate:
    name: dhat alloc gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Goal #4: the per-event engine loop must allocate nothing. This runs a fixed
      # backtest under the dhat heap profiler and bounds total allocations « bar count,
      # so a hot-loop allocation regression (e.g. a per-bar Box) fails CI. See
      # crates/akadro/tests/alloc_gate.rs.
      - run: cargo test -p akadro --features dhat-heap --test alloc_gate

  book:
    name: mdbook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@mdbook
      # Validates the book structure / SUMMARY links (the "I got a lifetime error"
      # guide). The code examples are anchored to the trybuild proofs in
      # akadro-compile-tests, which are the authoritative compile-fail checks.
      - run: mdbook build book
