[package]
name = "playground"
description = "Scratch binary for experimenting with akadro against real MEXC market data (NOT part of the library)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# The umbrella (backtest on by default) plus analytics, the data cache, serde (save the
# run report), and `venues` — the one-call `data::load`/`load_perp` venue dispatch, which
# pulls in the MEXC + OKX connectors with their live `net` transports. The playground no
# longer touches a venue crate directly: it asks `data::load` and gets ready bars.
# import-bars: this scratch binary's A/B benches rebuild feeds from a reused Vec<Bar>;
# the lab does NOT enable it. (The blessed path is data::load_*.)
akadro = { path = "../akadro", features = [
    "analytics",
    "data",
    "serde",
    "import-bars",
    "venues",
] }

[lints]
workspace = true
